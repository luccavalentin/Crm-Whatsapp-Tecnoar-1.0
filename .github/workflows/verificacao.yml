name: Verificação

# Porta de entrada do repositório. Até aqui o único conferidor era alguém
# lembrar de rodar `tsc` na própria máquina — e o que ninguém rodou é
# exatamente o que quebra em produção.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run teste

      - name: Build
        run: npm run build

      # As Edge Functions rodam em Deno e não entram no tsc do front. Aqui elas
      # pelo menos precisam ser código válido antes de chegarem ao deploy.
      - name: Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Conferir Edge Functions
        run: deno check supabase/functions/**/*.ts
