<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1C33" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- App instalado: sem barra do navegador, com a barra de status escura
         combinando com a topbar. O iOS ignora o manifest para isto. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tecnoar" />
    <meta name="application-name" content="Tecnoar" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

    <title>Tecnoar Atendimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Aparencia antes da primeira pintura. Se isto rodasse dentro do React,
         quem usa tema escuro levaria um flash branco a cada abertura do app —
         o pior lugar possivel para isso e o celular de plantao, de madrugada. -->
    <script>
      (function () {
        try {
          var escolha = localStorage.getItem('tecnoar:tema')
          if (escolha === 'dark' || escolha === 'light') {
            document.documentElement.setAttribute('data-theme', escolha)
          }
          var escuro =
            escolha === 'dark' ||
            (escolha !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) {
            document.documentElement.style.backgroundColor = '#060d18'
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#060d18')
          }
        } catch (e) {
          /* Armazenamento bloqueado: segue a preferencia do aparelho. */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
